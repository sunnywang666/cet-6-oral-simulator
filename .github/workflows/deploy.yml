name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

      - name: Upload dist to Nginx web root
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 62.234.55.246
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/usr/share/nginx/html"
          strip_components: 1
          rm: true

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.234.55.246
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            nginx -t && nginx -s reload || systemctl reload nginx || true
            ls -la /usr/share/nginx/html
